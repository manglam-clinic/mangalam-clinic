<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mangalam Clinic</title>

<style>

body{
font-family:Arial;
background:linear-gradient(135deg, rgba(93, 193, 226, 0.6) 0%, rgba(38, 44, 46, 0.2) 50%, rgba(42, 87, 100, 0.8) 100%),

url('DNA_BG.gif') center/cover no-repeat fixed;
min-height:100vh;
text-align:center;
padding-top:110px;
margin:0;
position:relative;
}

.card{
position:relative;
z-index:1;
background:linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
width:300px;
height:600px;
margin:auto;
padding:60px;
border-radius:20px;
box-shadow:0 8px 32px rgba(0, 0, 0, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.6);
border:1.5px solid rgba(255, 255, 255, 0.4);
backdrop-filter:blur(3px);
-webkit-backdrop-filter:blur(20px);
}

.logo{
max-width:200px;
height:auto;
margin:0px auto 0px auto;
display:block;
}

h2{
margin-bottom:5px;
margin-top:0;
color:#412b17;
text-shadow:2px 2px 4px rgba(0, 0, 0, 0.3);
}

p{
margin-top:0;
color:#e7f0ff;
text-shadow:0px 0px 15px rgba(0,0,0,1.0);
}

.btn{
display:block;
padding:25px;
margin-top:15px;
border-radius:12px;
text-decoration:none;
font-weight:bold;
color:white;
text-shadow:2px 2px 4px rgba(0,0,0,0.3);
}

.whatsapp{
background:rgba(27, 65, 44, 0.75);
}

.Appointment{
background:rgba(35, 49, 78, 0.75);
}

.location{
background:rgba(73, 35, 35, 0.75);
}

.About{
background:rgba(60, 43, 82, 0.75);
}

</style>

</head>

<body>

<div class="card">

<img src="Mangalam_Logo.png" alt="Mangalam Clinic Logo" class="logo">

<h2>Mangalam Clinic</h2>

<p>Dr. Chandrakant Anand</p>

<a class="btn whatsapp"
href="https://wa.me/919919454672?text=Hello%20Dr.%20Chandrakant%20Anand">
Chat on WhatsApp
</a>

<a class="btn Appointment"
href="https://docs.google.com/forms/d/e/1FAIpQLSfiqELlK6VTAFgWCyT90M_k7uKF9uiaiUPpmUz4kU7b6paSLQ/viewform?usp=dialog">
Book Appointment
</a>

<a class="btn location"
href="https://www.google.com/maps?q=26.292520,83.925082">
Clinic Location
</a>

<a class="btn About Doctor"
href="about_doctor.html">
About Doctor
</a>

</div>

</body>

</html>
